components:
  schemas:
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      - role
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        role:
          type: string
          enum:
          - CLAIMANT
          - OFFICER
    Submit:
      type: object
      additionalProperties: false
      required:
      - kind
      - market
      - incidentOn
      - description
      properties:
        kind:
          type: string
          enum:
          - MOTOR
          - PROPERTY
        market:
          type: string
          enum:
          - MY
          - SG
          - TH
          - ID
          - PH
          - HK
        incidentOn:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
    Login:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        password:
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
    Version:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    Ask:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - question
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        question:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
    Answer:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - answer
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        answer:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
    Reject:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - reason
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
    SetReserve:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - amount
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})\.[0-9]{2}$
          description: Decimal string, exactly two fractional digits.
    Settle:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - amount
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})\.[0-9]{2}$
          description: Decimal string, exactly two fractional digits.
          not:
            const: '0.00'
    Info:
      type: object
      additionalProperties: false
      required:
      - id
      - question
      - askedAt
      - answer
      - answeredAt
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        askedAt:
          type: string
          format: date-time
