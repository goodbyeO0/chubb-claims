openapi: 3.1.1
info:
  title: Claims workbench API
  version: 1.0.0
  description: Contract for a same-origin browser application. Time values are RFC 3339 instants. Monetary amounts are
    decimal strings. Successful commands return a fresh representation including version. Dates in examples are fixed
    demo data.
servers:
- url: /
security:
- session: []
paths:
  /actuator/health:
    get:
      operationId: health
      summary: Public summary. Limit detail to status.
      tags:
      - Public
      x-allowed-roles: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                healthy:
                  value:
                    status: UP
        '503':
          description: Unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                unhealthy:
                  value:
                    status: DOWN
      security: []
  /api/auth/csrf:
    get:
      operationId: csrf
      summary: Materialize a fresh CSRF cookie before login and after authentication changes.
      tags:
      - Public
      x-allowed-roles: []
      responses:
        '204':
          description: Success
          headers:
            Set-Cookie:
              description: XSRF-TOKEN cookie readable by Angular.
              schema:
                type: string
      security: []
  /api/auth/login:
    post:
      operationId: login
      summary: Authenticate form fields. No redirects.
      tags:
      - Public
      x-allowed-roles: []
      responses:
        '204':
          description: Success
          headers:
            Set-Cookie:
              description: Session cookie, HttpOnly; Secure on HTTPS.
              schema:
                type: string
        '401':
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BAD_CREDENTIALS:
                  value:
                    code: BAD_CREDENTIALS
                    message: Sign-in failed.
        '403':
          description: HTTP 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CSRF_INVALID:
                  value:
                    code: CSRF_INVALID
                    message: Refresh the CSRF token.
      security: []
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Copy the current XSRF-TOKEN cookie. Required for login and logout too.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              normal:
                value:
                  username: aina
                  password: local-demo-only
  /api/auth/me:
    get:
      operationId: me
      summary: Read the current user.
      tags:
      - Authenticated
      x-allowed-roles: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                claimant:
                  value:
                    id: 00000000-0000-4000-8000-000000000001
                    displayName: Aina
                    role: CLAIMANT
                officer:
                  value:
                    id: 00000000-0000-4000-8000-000000000010
                    displayName: Farah
                    role: OFFICER
        '401':
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  value:
                    code: UNAUTHENTICATED
                    message: Sign in to continue.
  /api/auth/logout:
    post:
      operationId: logout
      summary: Invalidate the server session.
      tags:
      - Authenticated
      x-allowed-roles: []
      responses:
        '204':
          description: Success
        '401':
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  value:
                    code: UNAUTHENTICATED
                    message: Sign in to continue.
        '403':
          description: HTTP 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CSRF_INVALID:
                  value:
                    code: CSRF_INVALID
                    message: Refresh the CSRF token.
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Copy the current XSRF-TOKEN cookie. Required for login and logout too.
  /api/claims:
    post:
      operationId: submitClaim
      summary: Submit an incident for the current claimant. Currency is derived from market.
      tags:
      - CLAIMANT
      x-allowed-roles:
      - CLAIMANT
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
              examples:
                submitted:
                  value:
                    kind: MOTOR
                    market: MY
                    incidentOn: '2026-11-18'
                    description: Rear bumper damaged in a collision.
                    id: 00000000-0000-4000-8000-000000000101
                    claimRef: CL-101
                    currency: MYR
                    status: SUBMITTED
                    version: 1
                    submittedAt: '2026-11-20T01:00:00Z'
                    closedAt: null
                    settlement: null
                    requests: []
                    timeline:
                    - type: CLAIM_SUBMITTED
                      at: '2026-11-20T01:00:00Z'
                      message: Claim received.
        '401':
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  value:
                    code: UNAUTHENTICATED
                    message: Sign in to continue.
        '403':
          description: HTTP 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: Access denied.
                CSRF_INVALID:
                  value:
                    code: CSRF_INVALID
                    message: Refresh the CSRF token.
        '400':
          description: HTTP 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_INPUT:
                  value:
                    code: INVALID_INPUT
                    message: Check the submitted fields.
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Copy the current XSRF-TOKEN cookie. Required for login and logout too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Submit'
            examples:
              normal:
                value:
                  kind: MOTOR
                  market: MY
                  incidentOn: '2026-11-18'
                  description: Rear bumper damaged in a collision.
    get:
      operationId: myClaims
      summary: List own claims newest first, tie-break by id.
      tags:
      - CLAIMANT
      x-allowed-roles:
      - CLAIMANT
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claims'
              examples:
                empty:
                  value: []
                normal:
                  value:
                  - kind: MOTOR
                    market: MY
                    incidentOn: '2026-11-18'
                    description: Rear bumper damaged in a collision.
                    id: 00000000-0000-4000-8000-000000000101
                    claimRef: CL-101
                    currency: MYR
                    status: SUBMITTED
                    version: 1
                    submittedAt: '2026-11-20T01:00:00Z'
                    closedAt: null
                    settlement: null
                    requests: []
                    timeline:
                    - type: CLAIM_SUBMITTED
                      at: '2026-11-20T01:00:00Z'
                      message: Claim received.
        '401':
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  value:
