services:
  db:
    restart: unless-stopped
    image: postgres:17.12
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claims-local-only}
    volumes: [claims-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U claims -d claims]
      interval: 3s
      timeout: 3s
      retries: 30
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  kafka:
    restart: unless-stopped
    image: apache/kafka:4.2.2
    volumes: [claims-kafka:/var/lib/kafka/data]
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    logging: *logging
  api:
    restart: unless-stopped
    image: ${APP_IMAGE:-claims-review-api:latest}
    build: .
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/claims
      DB_PASSWORD: ${DB_PASSWORD:-claims-local-only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
    depends_on:
      db: {condition: service_healthy}
    logging: *logging
volumes:
  claims-db:
  claims-kafka:
